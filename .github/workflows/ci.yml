# WindUp Gate — ciągła integracja.
#
# Sprawdza to samo co lokalne komendy z AGENTS.md:
# uv sync --locked, pytest z pokryciem >= 80%, ruff check, ruff format --check,
# pyright oraz uv build. Uruchamiane przy push na main i w każdym pull requeście.

name: CI

on:
  push:
    branches: [main, public]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: test-lint-typecheck-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install "uv==0.13.0"

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Pytest with coverage >= 80%
        run: >-
          .venv/bin/python -m pytest -q
          --cov=windup_gate --cov-report=term-missing --cov-fail-under=80

      - name: Ruff check
        run: .venv/bin/ruff check src tests

      - name: Ruff format check
        run: .venv/bin/ruff format --check src tests

      - name: Pyright
        run: .venv/bin/pyright

      - name: Build package
        run: uv build
